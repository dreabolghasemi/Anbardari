<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background Base with Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Industrial Warehouse Shelving Outline -->
  <g stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4">
    <line x1="120" y1="140" x2="120" y2="400" />
    <line x1="392" y1="140" x2="392" y2="400" />
    <line x1="120" y1="230" x2="392" y2="230" />
    <line x1="120" y1="320" x2="392" y2="320" />
    <line x1="120" y1="400" x2="392" y2="400" />
  </g>

  <!-- Central Shield Badge -->
  <path d="M256 90 L380 145 C380 270 256 360 256 360 C256 360 132 270 132 145 Z" 
        fill="#1e293b" stroke="#f97316" stroke-width="12" stroke-linejoin="round" />

  <!-- Fire Alarm Flame inside Shield -->
  <path d="M256 160 C240 210 210 230 210 270 C210 295 230 315 256 315 C282 315 302 295 302 270 C302 230 272 210 256 160 Z" 
        fill="url(#flameGrad)" />

  <!-- Inner Spark -->
  <path d="M256 240 C248 260 238 270 238 285 C238 296 246 304 256 304 C266 304 274 296 274 285 C274 270 264 260 256 240 Z" 
        fill="#fef08a" />

  <!-- Text Accents / Badge Details -->
  <rect x="180" y="415" width="152" height="34" rx="8" fill="#f97316" />
  <text x="256" y="438" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2">ESCO • WMS</text>
</svg>
