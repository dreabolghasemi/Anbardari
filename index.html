<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress benign Vite HMR websocket disconnection noise in AI Studio environment
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          const first = typeof args[0] === 'string' ? args[0] : '';
          if (first === '[vite]' || first.startsWith('[vite]')) {
            console.debug(...args);
            return;
          }
          origError.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (e && e.message && typeof e.message === 'string' && e.message.includes('[vite]')) {
            e.preventDefault();
          }
        });
        window.addEventListener('unhandledrejection', function(e) {
          const reason = e ? e.reason : null;
          const msg = (reason && (reason.message || String(reason))) || '';
          if (typeof msg === 'string' && (msg.includes('[vite]') || msg.includes('websocket') || msg.includes('WebSocket'))) {
            e.preventDefault();
          }
        });
      })();
    </script>
